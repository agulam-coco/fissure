<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#3a1428"/>
      <stop offset="0.55" stop-color="#170c1e"/>
      <stop offset="1" stop-color="#08070a"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e3f73"/>
      <stop offset="0.5" stop-color="#4c2a54"/>
      <stop offset="1" stop-color="#1c0f24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb245" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ff5a1f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="burst" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff1d6"/>
      <stop offset="0.45" stop-color="#ffb245"/>
      <stop offset="1" stop-color="#ff5a1f"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="tile"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#bg)"/>
    <circle cx="32" cy="23" r="20" fill="url(#glow)"/>
    <!-- eruption: three puffs -->
    <circle cx="27.5" cy="15" r="5" fill="#ff5a1f"/>
    <circle cx="37" cy="13.5" r="5.5" fill="#ff7a2a"/>
    <circle cx="32" cy="10" r="5.5" fill="url(#burst)"/>
    <path d="M28.5 23 Q32 14 35.5 23 Z" fill="#fff1d6"/>
    <!-- cone -->
    <path d="M2 62 C 15 55, 22 38, 26 23 L 38 23 C 42 38, 49 55, 62 62 Z" fill="url(#cone)"/>
    <ellipse cx="32" cy="23.2" rx="6" ry="1.7" fill="#ffd774"/>
    <!-- the fissure -->
    <path d="M32 24 L29.5 32 L34 38.5 L29.5 46 L33 54 L31 62" fill="none" stroke="#ff5a1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
    <path d="M32 24 L29.5 32 L34 38.5 L29.5 46 L33 54 L31 62" fill="none" stroke="#ff8a2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M32 24 L29.5 32 L34 38.5 L29.5 46 L33 54 L31 62" fill="none" stroke="#ffe08a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
